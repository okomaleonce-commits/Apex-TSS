name: APEX-TURF-WORM

# Passage horaire, entierement autonome : aucun connecteur, aucun modele.
#
#   rendu du programme LONACI  ->  perimetre  ->  scan  ->  pont MI  ->  email SMTP
#
# Pourquoi ici et pas dans une Routine claude.ai : mesure du 07/10/2026, depuis un
# conteneur claude.ai les ports SMTP 587, 465 et 25 expirent tous (la sortie passe par
# un proxy HTTPS, pas par du TCP brut), et Chromium refuse la CA de ce proxy. Sur un
# runner GitHub il n'y a ni l'un ni l'autre : c'est le seul endroit ou la chaine peut
# tourner seule.
#
# Les snapshots partent en ARTEFACTS, pas en commits : 12 commits par jour rendraient
# l'historique illisible. Le passage suivant les retelecharge, sans quoi il n'y aurait
# pas de COMPARE et chaque passage repartirait de zero.
#
# ---------------------------------------------------------------------------------
# MESURE DU 08/10/2026 ET CE QU'ELLE A CHANGE ICI
#
# Le cron precedent etait '17 8-19 * * *', soit douze passages attendus par jour.
# Executes reellement, en deux jours :
#
#     2026-10-08T15:41:55Z  success
#     2026-10-07T20:39:50Z  success
#
# DEUX sur vingt-quatre, et les deux rendus 22 a 24 minutes apres l'heure prevue. Le
# cron de GitHub Actions n'est pas une horloge : les declenchements planifies sont
# rendus au mieux et la plupart sont abandonnes.
#
# Consequence directe, verifiee dans le registre : `derive` sortait UNAVAILABLE
# « premier passage du jour » sur CHAQUE course, et la decision ne reposait que sur
# favori_dominant — un seul moteur actif sur quatre. Or en pari mutuel la derive est
# LE signal : il n'y a qu'une cote, et elle est l'argent.
#
# Deux corrections, et la premiere est la vraie :
#
#   1. CHAQUE RUN FAIT SA PROPRE TRAJECTOIRE. Il enchaine deux passages espaces de
#      12 minutes (sous-commande `serie`). Un declenchement recu suffit desormais a
#      produire une comparaison : on ne depend plus de DEUX declenchements separes,
#      ce qui etait precisement ce qui ne se produisait jamais.
#   2. REDONDANCE. '*/15' au lieu de '17' : 48 tentatives par jour au lieu de 12. Le
#      depot est PUBLIC, donc les minutes de runner sont gratuites et illimitees —
#      il n'y a aucune raison d'etre econome de tentatives.
#
# L'intervalle de 12 minutes n'est pas arbitraire. Mesure du 08/10 : a UNE minute
# d'intervalle l'amplitude maximale releve 0,0 % — les cotes PMU n'ont pas bouge, la
# serie mesurerait du vide. A neuf minutes elle relevait 15,6 %.
#
# Reserve a garder en tete : les quantiles de `derive` sont mesures sur une JOURNEE
# entiere (cote du matin -> cote finale), alors qu'on compare ici deux passages a 12
# minutes. Le score est donc une borne inferieure — le signal est SOUS-ESTIME, jamais
# surestime. C'est le sens conservateur. Accumuler ces paires est justement ce qui
# permettra de re-estimer les quantiles a la bonne echelle.

on:
  schedule:
    # 48 tentatives/jour. GitHub en abandonnera la plupart : c'est le but d'en
    # demander autant. Minutes gratuites (depot public), donc aucune parcimonie.
    - cron: '*/15 8-19 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "DDMMYYYY (vide = aujourd'hui)"
        required: false
      max_courses:
        description: "limite de courses (diagnostic)"
        required: false
      passages:
        description: "passages dans ce run (defaut 2)"
        required: false
      intervalle:
        description: "minutes entre deux passages (defaut 12)"
        required: false

concurrency:
  group: apex-turf-worm
  cancel-in-progress: false      # ne jamais annuler : on perdrait un releve

permissions:
  contents: read

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 45      # la serie attend entre ses passages : voir --budget-min
    env:
      APEX_TIMEZONE: ${{ vars.APEX_TIMEZONE || 'Africa/Abidjan' }}
      WORM_SMTP_HOST: ${{ secrets.WORM_SMTP_HOST }}
      WORM_SMTP_PORT: ${{ secrets.WORM_SMTP_PORT }}
      WORM_SMTP_USER: ${{ secrets.WORM_SMTP_USER }}
      WORM_SMTP_PASS: ${{ secrets.WORM_SMTP_PASS }}
      WORM_EMAIL_TO: ${{ secrets.WORM_EMAIL_TO }}
      WORM_EMAIL_FROM: ${{ secrets.WORM_EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip


      # Sans les snapshots du passage precedent il n'y a pas de trajectoire, et la
      # trajectoire est LA donnee du pari mutuel : il n'y a qu'une cote.
      - name: Reprendre les snapshots du passage precedent
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: turf-worm-snapshots
          path: data/turf_worm/snapshots

      - name: Fenetre APEX
        run: python3 tools/apex_turf_worm.py window

      # La passerelle JSON repond depuis un runner (eprouve le 07/10) et ne demande
      # aucun navigateur. On l'essaie SEULE d'abord : installer Chromium a chaque
      # passage coutait plus de temps que tout le reste du job reuni, pour un chemin
      # de secours qui ne sert pas. Il reste disponible, il n'est plus paye d'avance.
      - name: Rendu du programme LONACI — passerelle seule
        id: rendu
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p data/turf_worm/lonaci
          python3 tools/apex_turf_lonaci_render.py --only passerelle --out /tmp/lonaci.txt \
            | tee /tmp/rendu.out
          cat /tmp/rendu.out >> "$GITHUB_OUTPUT"

      - name: Rendu de secours par navigateur
        id: rendu_nav
        if: steps.rendu.outcome == 'failure'
        run: |
          set -o pipefail
          echo "La passerelle n'a pas abouti : on paie le navigateur."
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/apex_turf_lonaci_render.py --only navigateur --out /tmp/lonaci.txt \
            | tee /tmp/rendu.out
          cat /tmp/rendu.out >> "$GITHUB_OUTPUT"

      - name: Perimetre LONACI
        run: |
          D="${{ inputs.date }}"
          [ -z "$D" ] && D=$(TZ="$APEX_TIMEZONE" date +%d%m%Y)
          echo "date LONACI : $D"
          python3 tools/apex_turf_lonaci.py scope --date "$D" --from-text /tmp/lonaci.txt

      # Le scan construit ET envoie le digest : apex_turf_worm.envoyer_smtp() part seule
      # des que les secrets WORM_SMTP_* sont la. Sans eux il le dit et n'envoie rien.
      - name: Serie de passages, restreinte au perimetre LONACI
        run: |
          P="${{ inputs.passages }}";   [ -z "$P" ] && P=2
          I="${{ inputs.intervalle }}"; [ -z "$I" ] && I=12
          # budget = de quoi tenir les intervalles demandes, plus une marge, et
          # toujours sous timeout-minutes. La serie s'arrete d'elle-meme des qu'il
          # n'y a plus de course a venir dans le perimetre.
          B=$(( P * I + 8 ))
          ARGS="--lonaci --email-si-changement --passages $P --intervalle $I --budget-min $B"
          [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date ${{ inputs.date }}"
          [ -n "${{ inputs.max_courses }}" ] && ARGS="$ARGS --max-courses ${{ inputs.max_courses }}"
          python3 tools/apex_turf_worm.py serie $ARGS

      - name: Pont APEX-TURF-MI (H-30)
        run: python3 tools/apex_turf_mi.py worm-hook --within 30
        continue-on-error: true

      - name: Resume du passage
        if: always()
        env:
          # le chemin de secours a ses propres sorties : prendre celle qui a servi
          RENDU_SOURCE: ${{ steps.rendu.outputs.SOURCE || steps.rendu_nav.outputs.SOURCE }}
          RENDU_COURSES: ${{ steps.rendu.outputs.COURSES || steps.rendu_nav.outputs.COURSES }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, glob, datetime
          from zoneinfo import ZoneInfo
          tz = os.environ.get("APEX_TIMEZONE", "UTC")
          jour = datetime.datetime.now(ZoneInfo(tz)).date().isoformat()
          src = os.environ.get("RENDU_SOURCE") or "echec"
          n = os.environ.get("RENDU_COURSES") or "0"
          L = [f"## APEX-TURF-WORM — passage {datetime.datetime.now(datetime.timezone.utc):%H:%M} UTC", "",
               f"- rendu du programme : `{src}` · {n} course(s) au programme LONACI"]
          L.append("- email : SMTP configure" if os.environ.get("WORM_SMTP_HOST")
                   else "- email : **secrets `WORM_SMTP_*` absents** — digest construit, non envoye")
          L += ["",
                "> Palier maximal **SURVEILLER**. Les deux gates de pari turf sont fermees par le",
                "> backtest (trot ROI -4,58 % sur 118 paris, obstacle -89,05 % sur 21).",
                "> `autorite_pari = false` sur chaque ligne.",
                "",
                "> Cotes : **PMU_FRANCE**. La masse d'enjeux LONACI n'est pas verifiee.",
                ""]
          r = f"reports/turf_worm/{jour}.md"
          if os.path.exists(r):
              L += ["<details><summary>Rapport du passage</summary>", "",
                    open(r, encoding="utf-8").read(), "</details>", ""]
          print("\n".join(L))
          PY

      - name: Publier les snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turf-worm-snapshots
          path: data/turf_worm/snapshots
          retention-days: 7
          overwrite: true

      - name: Publier les rapports et le perimetre
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turf-worm-reports
          path: |
            reports/turf_worm
            data/turf_worm/lonaci
          retention-days: 14
          overwrite: true
