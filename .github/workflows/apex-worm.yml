name: APEX-WORM scanner

# Scan complet toutes les heures (spec §32). Le programme décide lui-même quels matchs
# appartiennent à la fenêtre APEX courante (08:00 → 07:59, spec §2).
on:
  schedule:
    - cron: "3 * * * *"        # toutes les heures à HH:03 (léger décalage pour éviter la minute 0 surchargée)
  workflow_dispatch:            # exécution manuelle (spec §32)
    inputs:
      leagues:
        description: "Filtrer sur des ligues (ids API-Football séparés par des virgules) — vide = toutes"
        required: false
        default: ""
      max_calls:
        description: "Plafond d'appels API pour ce passage"
        required: false
        default: "400"

concurrency:
  group: apex-worm
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install numpy scipy

      - name: Run tests (spec §31)
        run: python3 tests/test_apex_worm.py

      - name: FULL SCAN (+ argent public excapper + email)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}   # jamais dans le code (spec §33)
          FOOTYSTATS_KEY: ${{ secrets.FOOTYSTATS_KEY }}
          APEX_TIMEZONE: ${{ vars.APEX_TIMEZONE || 'UTC' }}   # fuseau configurable (spec §2)
          # excapper = données PUBLIQUES (Betfair MoneyWay), aucune clé requise.
          # arbworld = uniquement si tu as une API autorisée (sinon composante arbitrage indisponible)
          ARBWORLD_API_URL: ${{ secrets.ARBWORLD_API_URL }}
          ARBWORLD_KEY: ${{ secrets.ARBWORLD_KEY }}
          # Notification email (SMTP)
          WORM_SMTP_HOST: ${{ secrets.WORM_SMTP_HOST }}
          WORM_SMTP_PORT: ${{ vars.WORM_SMTP_PORT || '587' }}
          WORM_SMTP_USER: ${{ secrets.WORM_SMTP_USER }}
          WORM_SMTP_PASS: ${{ secrets.WORM_SMTP_PASS }}
          WORM_EMAIL_TO: ${{ vars.WORM_EMAIL_TO }}
        run: |
          # Sans secret API_FOOTBALL_KEY, l'API refuse la requête et le scan sort en erreur
          # (le cron échouait toutes les heures). On ignore proprement le passage dans ce cas :
          # le job reste VERT et un avertissement explique comment l'activer. Configurer le
          # secret API_FOOTBALL_KEY (Settings → Secrets and variables → Actions) réactive le scan.
          if [ -z "${API_FOOTBALL_KEY}" ]; then
            echo "::warning title=APEX-WORM::API_FOOTBALL_KEY absent — scan CI ignoré. Renseigner le secret pour activer le passage horaire (l'analyse continue par ailleurs dans les sessions APEX)."
            exit 0
          fi
          python3 tools/apex_worm.py scan \
            --leagues "${{ github.event.inputs.leagues }}" \
            --max-calls "${{ github.event.inputs.max_calls || 400 }}" \
            --money --email

      - name: Upload report + snapshots (artefacts, pas de commit horaire — spec §30)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-worm-${{ github.run_id }}
          path: |
            reports/worm/
            data/worm/
          retention-days: 14
          if-no-files-found: ignore
