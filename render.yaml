services:
  - type: web
    name: apex-tss-bot
    runtime: python
    buildCommand: pip install -r requirements_render.txt
    startCommand: python webhook_server.py
    plan: free
    envVars:
      # Secrets : JAMAIS en clair dans le dépôt. `sync: false` = valeur saisie dans le
      # dashboard Render (Environment), hors Git. Révoquer + renouveler toute clé qui a été
      # committée en clair (elle reste dans l'historique Git tant qu'il n'est pas purgé).
      - key: BOT_TOKEN
        sync: false
      - key: FDORG_TOKEN
        sync: false
      - key: ODDS_API_KEY
        sync: false
      # Non secrets (configuration) :
      - key: CHAT_ID
        value: "5484281251"
      - key: WEBHOOK_URL
        value: "https://apex-tss.onrender.com"
      - key: PORT
        value: "10000"
    healthCheckPath: /health
    autoDeploy: true   # Auto-deploy on every GitHub push
